version: '3.8'

services:
  stargzr:
    #build: .
    image: omersadikovic/stargzr:latest
    container_name: stargzr
    ports:
      - "8083:8083"
    volumes:
      # CHANGE THIS PATH to your media folder location
      - ./media:/app/media:ro
      # Keeps the accounts database across restarts
      - ./data:/app/data
    environment:
      - MEDIA_PATH=/app/media
      - DB_PATH=/app/data/stargzr.db
      # CHANGE THIS to a long random string. Without it logins reset on redeploy.
      - JWT_SECRET=change-me-to-something-long-and-random
    restart: unless-stopped