[package]
name = "stargzr"
version = "0.1.0"
edition = "2024"

[dependencies]
hyper = { version = "1.8.1", features = ["full"] }
tokio = { version = "1.49.0", features = ["full"] }
axum = { version = "0.8.8", features = ["ws", "multipart"] }
askama = "0.15.4"
tokio-util = "0.7.18"
uuid = { version = "1.20.0", features = ["v4", "fast-rng"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
futures-util = "0.3.31"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
rand = "0.9.2"
dashmap = "6.1.0"
env = "1.0.1"
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"
tower-http = { version = "0.6.8", features = ["fs", "set-header"] }
zip = "8.2.0"

# Accounts: a small local SQLite file, PBKDF2 password hashing, hand-rolled
# HS256 JWTs. hmac/sha2/base64/pbkdf2 are already in the tree as transitive
# deps, pulling them up here just makes them ours to call directly.
rusqlite = { version = "0.32", features = ["bundled"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
pbkdf2 = { version = "0.12", default-features = false }
